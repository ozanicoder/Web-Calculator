<!DOCTYPE html>
<html lang="pt-ao">

<head>
    <title>Calculus 2k</title>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="description" content="">
    <meta name="keyword" content="">
    <meta name="autor" content="ozanicoder">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="mathjs-15.2.0/lib/browser/math.js"></script>
    <script src="script.js" defer> </script>
    

    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div id="calc">
        <div id="input">
            <input type="text" id="display" value="0" >
        </div>
    
        <div id="keys">
    
            <div id="opt-btn">
                
                <div class="opt" id="c">C</div>

            </div>
    
            <div class="operators">
                <div class="operator" id="eql">=</div>
                
            </div>
            
            <div id="numbers">
                <div class="number" id="7">7</div>
                <div class="number" id="8">8</div>
                <div class="number" id="9">9</div>
                <div class="number" id="4">4</div>
                <div class="number" id="5">5</div>
                <div class="number" id="6">6</div>
                <div class="number" id="1">1</div>
                <div class="number" id="2">2</div>
                <div class="number" id="3">3</div>
                <div class="number" id="0">0</div>
                <div class="number" id="dot">.</div>
                <div class="number" id="del">⌫</div>
                
            
            </div>
            <div id="operators">
                <div class="operator" id="m">x</div>
                <div class="operator" id="l">-</div>
                <div class="operator" id="p">+</div>
                <div class="operator" id="d">/</div>
            </div>
    
        </div>
    </div>
</body>

</html>
